name: Frontend CI

on:
  pull_request:
    paths:
      - 'hangman-front/**'

defaults:
  run:
    working-directory: hangman-front

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: hangman-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test
